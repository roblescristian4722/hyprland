# ==========================================
# AUTOSTART
# ==========================================
exec-once = hyprpanel
exec-once = hypridle

# ==========================================
# ENV (POP!_OS & NVIDIA)
# ==========================================
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# Setup up monitors
monitor = DP-3, 2560x1440@144, 1080x0, 1
monitor = DP-4, 1920x1080@164, 0x0, 1, transform, 1

# Set up monitor-workspace config
workspace = 1, monitor:DP-4
workspace = 2, monitor:DP-4
workspace = 3, monitor:DP-3
workspace = 4, monitor:DP-3
workspace = 5, monitor:DP-3
workspace = 6, monitor:DP-3

# ==========================================
# PROGRAM CMDS
# ==========================================
$terminal = kitty
$mainMod = SUPER
$rofi = /bin/rofi -config $HOME/.config/rofi/config.rasi -show

cursor {
    no_hardware_cursors = true
}

dwindle {
    # Fix for togglesplit
    preserve_split = true
}

input {
    kb_layout = latam
    follow_mouse = 2
    float_switch_override_focus = 0
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    # Curva personalizada: arranca rápido y frena suavemente al final
    bezier = snappy, 0.05, 0.9, 0.1, 1.05

    # El '2' y el '3' son la duración (en ms relativos), números bajos = más rápido
    animation = windows, 1, 2, snappy
    animation = windowsOut, 1, 2, default, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, snappy
}

# ==========================================
# BINDS 
# ==========================================

# Terminal
bind = $mainMod, Return, exec, $terminal
bind = alt, Return, exec, $terminal

# Close window
bind = alt, Q, killactive,

# Focus windows
bind = ALT, ntilde, movefocus, r  # Right
bind = ALT, j, movefocus, l  # Left
bind = ALT, l, movefocus, u  # Up
bind = ALT, k, movefocus, d  # Down

# Move windows (Alt + Shift + j/k/l/ñ)
bind = ALT SHIFT, ntilde, movewindow, r
bind = ALT SHIFT, j, movewindow, l
bind = ALT SHIFT, l, movewindow, u
bind = ALT SHIFT, k, movewindow, d

# Move to relative workspaces
bind = $mainMod, ntilde, workspace, +1
bind = $mainMod, j, workspace, -1

# Move window to relative workspaces
bind = $mainMod SHIFT, ntilde, movetoworkspace, +1
bind = $mainMod SHIFT, j, movetoworkspace, -1

# Move to workspace <number>
bind = $mainMod, 0, workspace, 0
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move window to workspace
bind = $mainMod SHIFT, 0, movetoworkspace, 0
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Exeute Rofi (menu)
bind = $mainMod, space, exec, $rofi

# Move window to relative workspaces
bind = $mainMod SHIFT, ntilde, movetoworkspace, m+1
bind = $mainMod SHIFT, j, movetoworkspace, -1

# Resize window using keyboard
binde = ALT SHIFT, right, resizeactive, 110 0
binde = ALT SHIFT, left, resizeactive, -110 0
binde = ALT SHIFT, up, resizeactive, 0 -110
binde = ALT SHIFT, down, resizeactive, 0 110

# Move window using mouse
bindm = $mainMod, mouse:272, movewindow
bindm = ALT, mouse:272, movewindow

# Resize window using mouse
bindm = $mainMod, mouse:273, resizewindow

# Fullscreen
bind = $mainMod, f, fullscreen, 0

# Toggle floating window
bind = $mainMod, d, togglefloating

# Focus floating window
bind = ALT, space, focuscurrentorlast

# Flameshot
bind = $mainMod SHIFT, S, exec, flameshot gui

# Toglle vertical window
bind = $mainMod, V, layoutmsg, togglesplit
